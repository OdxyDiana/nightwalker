              <a

              </a>
              <a
                class="nav-icon p-2 surface-2 rounded-sm text-color flex align-center border"

          <div

            <div id="profile-header" class="grid grid-cols-12 gap-2 p-2 col-span-12 col-start-1 surface-2 border-color-1 rounded-sm">

            <div id="profile-nickname" class="surface-2 border-color-1 rounded-sm xl:p-5 p-3 text-center text-3xl col-span-12 row-start-2 uppercase text-bold">

              <div id="profile-actions-buttons-container" class="col-span-6 col-start-7 surface-1  rounded-sm xl:p-5 p-3"></div>
              <div id="profile-avatar-rank" class="contents">

                      >

                          class="max-h-[400px] max-w-[250px] rounded-sm aspect-[10/16]" src="https://images2.imgbox.com/0c/77/494XeWpw_o.png" alt="Avatar"

                     </div>
